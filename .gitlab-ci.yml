image: node:20

stages:
  - test
  - build

variables:
  NEXT_TELEMETRY_DISABLED: "1"
  SKIP_ENV_VALIDATION: "1"
  PNPM_STORE_PATH: "$CI_PROJECT_DIR/.pnpm-store"
  BETTER_AUTH_SECRET: "$CI_COMMIT_SHA"
  BETTER_AUTH_URL: "http://localhost:3000"
  GOOGLE_CLIENT_ID: "ci"
  GOOGLE_CLIENT_SECRET: "ci"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/

default:
  before_script:
    - |
      set -euo pipefail
      if command -v corepack >/dev/null 2>&1; then
        corepack enable
        corepack prepare pnpm@10.28.1 --activate
      else
        if ! command -v npm >/dev/null 2>&1; then
          echo "npm not found (shell executor ignores image:). Install Node.js/npm on the runner, or switch to a Docker executor."
          exit 1
        fi
        npm i -g pnpm@10.28.1
      fi
      pnpm --version
    - mkdir -p "$PNPM_STORE_PATH"
    - pnpm config set store-dir "$PNPM_STORE_PATH"
    - pnpm install --frozen-lockfile

test:
  stage: test
  script:
    - pnpm check
    - pnpm test --run

build:
  stage: build
  needs:
    - test
  script:
    - pnpm build
