# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
image: node:18

variables:
  POSTGRES_DB: webapp_test
  POSTGRES_USER: webapp
  POSTGRES_PASSWORD: webapp
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  DATABASE_URL: postgres://webapp:webapp@postgres:5432/webapp_test
  PGPASSWORD: webapp
  SECRET_DETECTION_ENABLED: "true"

default:
  services:
    - name: postgres:15
      alias: postgres

before_script:
  - |
    if ! command -v npm >/dev/null 2>&1; then
      echo "npm not found, installing Node locally into $CI_PROJECT_DIR/.node"
      NODE_VERSION=18.20.0
      curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz" -o node.tar.gz
      mkdir -p .node
      tar -xzf node.tar.gz -C .node --strip-components=1
      export PATH="$CI_PROJECT_DIR/.node/bin:$PATH"
    fi
  - |
    echo "Runner executor: ${CI_RUNNER_EXECUTOR:-unknown}"
    echo "POSTGRES_HOST=$POSTGRES_HOST POSTGRES_PORT=$POSTGRES_PORT"
    node --version
    npm --version || true
    if command -v getent >/dev/null 2>&1; then
      echo "DNS lookup for $POSTGRES_HOST:";
      getent hosts "$POSTGRES_HOST" || true
    fi

    max_attempts=60
    attempt=1
    while [ "$attempt" -le "$max_attempts" ]; do
      node -e "const net=require('net');const client=net.connect({host:process.env.POSTGRES_HOST,port:Number(process.env.POSTGRES_PORT)},()=>{client.end();process.exit(0);});client.on('error',()=>process.exit(1));" && break
      echo "Waiting for Postgres... (${attempt}/${max_attempts})"
      attempt=$((attempt + 1))
      sleep 2
    done

    node -e "const net=require('net');const client=net.connect({host:process.env.POSTGRES_HOST,port:Number(process.env.POSTGRES_PORT)},()=>{client.end();process.exit(0);});client.on('error',()=>process.exit(1));" \
      || (echo "Postgres service is not reachable. If CI_RUNNER_EXECUTOR is 'shell', GitLab 'services:' are ignored and no Postgres container is started. Use a Docker/Kubernetes executor (or point DATABASE_URL at an external Postgres for CI)." && exit 1)
  - npm --version
stages:
- build
- test
- deploy
- review
- dast
- staging
- canary
- production
- incremental rollout 10%
- incremental rollout 25%
- incremental rollout 50%
- incremental rollout 100%
- performance
- cleanup
- secret-detection
sast:
  stage: test
include:
- template: Auto-DevOps.gitlab-ci.yml
secret_detection:
  stage: secret-detection

build:
  stage: build
  image: node:18
  script:
    - npm i -g pnpm@latest
    - pnpm install --frozen-lockfile
    - pnpm db:migrate
    - pnpm build
  artifacts:
    paths:
      - .next
  rules:
    - when: always
